name: Deploy Book
on:
  push:
    branches: [ main, master ] # Catch both common default branches

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # Updated to v5
        
      - name: Setup Node
        uses: actions/setup-node@v5   # Updated to v5
        with:
          node-version: '22'
          
      - name: Install MyST CLI
        run: npm install -g mystmd
        
      - name: Build HTML
        run: myst build D2Dbook --html
        
      - name: Setup Pages
        uses: actions/configure-pages@v6   # Updated to v6
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4   # Updated to v4
        with:
          path: 'D2Dbook/_build/html'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5   # Updated to v5